<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentFlow AI — Gestión de Candidatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stylesGestion.css">
</head>
<body>

<div class="wrap">

  <header>
    <div>
      <p class="eyebrow">TalentFlow AI · RRHH</p>
      <h1>Gestión de Candidatos</h1>
    </div>
    <div class="status">
      <div><span class="status-dot" id="statusDot"></span><span id="statusText">Conectando con Sheets…</span></div>
      <button id="refreshBtn" type="button">Actualizar ahora</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-field">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Buscar por nombre, correo o ticket…" autocomplete="off">
    </div>

    <div class="filter-field">
      <label for="filtroVacante">Vacante</label>
      <select id="filtroVacante">
        <option value="">Todas</option>
      </select>
    </div>

    <div class="filter-field">
      <label for="filtroEstado">Estado</label>
      <select id="filtroEstado">
        <option value="">Todos</option>
      </select>
    </div>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2>Candidatos <small id="resultCount"></small></h2>
    </div>

    <div id="candidateList" class="candidate-list"></div>

    <div class="pagination" id="pagination"></div>
  </section>

  <footer>
    Lectura: Google Sheets API v4 · Escritura: webhook de n8n · los cambios de estado se procesan de forma asíncrona
  </footer>

</div>

<div class="toast" id="toast"></div>

<script src="scriptGestion.js"></script>
</body>
</html>
